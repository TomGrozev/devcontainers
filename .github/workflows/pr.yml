name: PR Smoke Tests

on:
  pull_request:
    branches:
      - master

jobs:
  smoke:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image (single arch, load into Docker)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: base
          set: |
            *.platform=linux/amd64
          load: true

      - name: Smoke test — shared binaries
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest nvim --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest rg --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest bat --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest delta --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest rtk --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest node --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest npm --version
          echo "=== All shared binaries resolved ==="

      - name: Smoke test — user + sudo/su wrappers
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest id dev
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest sudo true
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest su -c true
          # safe.directory must be visible to `dev`, not only to root: a workspace
          # whose files have another UID fails git's ownership check without it.
          docker run --rm ghcr.io/tomgrozev/devcontainer-base:latest sh -c 'test "$(git config --get-all safe.directory)" = "*"'
          echo "=== User and wrapper tests passed ==="

      - name: Build Elixir image (single arch, load into Docker)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: elixir
          set: |
            *.platform=linux/amd64
          load: true

      - name: Smoke test — Elixir toolchain
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-elixir:latest elixir -v
          docker run --rm ghcr.io/tomgrozev/devcontainer-elixir:latest erl -noshell -eval 'crypto:start(),halt()'
          docker run --rm ghcr.io/tomgrozev/devcontainer-elixir:latest mix local.hex --force
          docker run --rm ghcr.io/tomgrozev/devcontainer-elixir:latest mix help
          echo "=== Elixir toolchain verified ==="

      - name: Build Rust image (single arch, load into Docker)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: rust
          set: |
            *.platform=linux/amd64
          load: true

      - name: Smoke test — Rust toolchain
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-rust:latest rustc -V
          docker run --rm ghcr.io/tomgrozev/devcontainer-rust:latest cargo -V
          docker run --rm ghcr.io/tomgrozev/devcontainer-rust:latest cargo new /tmp/smoke-test && cd /tmp/smoke-test && cargo b && cd / && rm -rf /tmp/smoke-test
          echo "=== Rust toolchain verified ==="

      - name: Build Elixir agent image (single arch, load into Docker)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: agent-elixir
          set: |
            *.platform=linux/amd64
          load: true

      - name: Smoke test — Kelos agent interface (Elixir)
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest sh -c 'test "$(id -u)" = 61100'
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest test -x /kelos_entrypoint.sh
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest omp --version
          # The image is dotfiles-agnostic: it bakes in no omp config and no omp
          # plugins, and DOTFILES_URI is optional, so an unset value must not be
          # fatal — the session-setup path prepares the environment and exits 0
          # without starting the agent.
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest test ! -e /home/agent/.omp/agent/config.yml
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest test ! -e /home/agent/.omp/plugins
          docker run --rm -e KELOS_SESSION_SETUP_ONLY=1 ghcr.io/tomgrozev/devcontainer-agent-elixir:latest /kelos_entrypoint.sh
          # MIX_HOME and HEX_HOME point under /home/dev, which the language image
          # creates owned by dev (1000) at mode 0700 — the agent UID must own it or
          # mix cannot install an archive there.
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-elixir:latest sh -c 'mkdir -p "$MIX_HOME/archives" "$HEX_HOME"'
          echo "=== Kelos agent interface verified ==="

      - name: Build Rust agent image (single arch, load into Docker)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: agent-rust
          set: |
            *.platform=linux/amd64
          load: true

      # The agent Dockerfile is shared, so this only proves the second language
      # layer (Rust) plus the agent layer's presence.
      - name: Smoke test — Rust agent interface
        run: |
          set -e
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-rust:latest sh -c 'test "$(id -u)" = 61100'
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-rust:latest test -x /kelos_entrypoint.sh
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-rust:latest omp --version
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-rust:latest rustc -V
          # CARGO_HOME points under /home/dev (see the Elixir step): cargo creates
          # its registry cache there, so the agent UID must own it.
          docker run --rm ghcr.io/tomgrozev/devcontainer-agent-rust:latest sh -c 'mkdir -p "$CARGO_HOME/registry/cache"'
          echo "=== Rust agent interface verified ==="
