name: Scheduled Release

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.bump.outputs.tag }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      has_major: ${{ steps.major.outputs.has_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine last tag and image-relevant changes
        id: changes
        run: |
          set -euo pipefail
          # Highest v<maj>.<min>.<pat> tag on the remote. Release tags point at
          # bot commits pushed via the tag alone, so they are not ancestors of
          # HEAD and git describe misses the latest one -- which made the bump
          # collide with an existing tag (fatal: tag 'v0.8.0' already exists).
          last_tag="$(git ls-remote --tags origin 'v[0-9]*.*.*' \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)" || true
          last_tag="${last_tag:-}"
          if [[ -z "$last_tag" ]]; then
            echo "No existing tags; will cut an initial release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "last_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          changed="$(git diff --name-only "${last_tag}..HEAD" -- images shared docker-bake.hcl)"
          if [[ -z "$changed" ]]; then
            echo "No image-relevant changes since $last_tag; skipping release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.has_changes == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Detect major dependency updates
        id: major
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          last_tag="${{ steps.changes.outputs.last_tag }}"
          if [[ -z "$last_tag" ]]; then
            echo "has_major=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read current versions from bake
          bake_json="$(docker buildx bake elixir rust --print 2>/dev/null)"

          # Check out the old tag's bake.hcl to compare versions
          old_bake="$(git show "${last_tag}:docker-bake.hcl" 2>/dev/null || echo "{}")"

          has_major=0
          for dep in NVIM_VERSION RTK_VERSION DELTA_VERSION RIPGREP_VERSION BAT_VERSION OPENCODE_VERSION RUST_VERSION; do
            new_ver="$(echo "$bake_json" | jq -r ".target.elixir.args.${dep} // .target.rust.args.${dep} // \"\"")"
            old_ver="$(echo "$old_bake" | grep -oP "${dep}\s*=\s*\"[^\"]*\"|${dep}\s*default\s*=\s*\"[^\"]*\"" | grep -oP '"[^"]*"' | tr -d '"' | head -1 || echo "")"
            [[ -z "$new_ver" || -z "$old_ver" ]] && continue
            on="${old_ver#v}"; nn="${new_ver#v}"
            o_maj="${on%%.*}"; n_maj="${nn%%.*}"
            if [[ "$o_maj" =~ ^[0-9]+$ ]] && [[ "$n_maj" =~ ^[0-9]+$ ]]; then
              if (( n_maj > o_maj )); then
                has_major=1
                echo "::warning::Major dependency update detected: $dep $old_ver -> $new_ver"
              fi
            fi
          done
          echo "has_major=$has_major" >> "$GITHUB_OUTPUT"

      - name: Compute next minor tag
        id: bump
        if: steps.changes.outputs.has_changes == 'true' && steps.major.outputs.has_major == '0'
        run: |
          set -euo pipefail
          last_tag="${{ steps.changes.outputs.last_tag }}"
          if [[ -z "$last_tag" ]]; then
            new_tag="v0.1.0"
          else
            v="${last_tag#v}"
            maj="$(echo "$v" | cut -d. -f1)"
            min="$(echo "$v" | cut -d. -f2)"
            min=$(( ${min:-0} + 1 ))
            new_tag="v${maj}.${min}.0"
          fi

          # Refuse to re-create a tag that exists on the remote but was not seen
          # as last_tag (defends against semver-sorting blind spots).
          if git ls-remote --exit-code --tags origin "refs/tags/${new_tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${new_tag} already exists on the remote but is not the detected last_tag. Clean up the remote tag (it is not part of any release) and cut a manual tag instead."
            exit 1
          fi
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "New release tag: $new_tag"

      - name: Refresh README version table
        if: steps.changes.outputs.has_changes == 'true' && steps.major.outputs.has_major == '0'
        run: |
          set -euo pipefail
          ./scripts/gen-readme-versions.sh

      - name: Commit README update and create git tag
        if: steps.changes.outputs.has_changes == 'true' && steps.major.outputs.has_major == '0'
        run: |
          set -euo pipefail
          new_tag="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage README if it was updated
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: update version table for ${new_tag}"
          fi

          git tag -a "$new_tag" -m "Automated release $new_tag"
          git push origin "$new_tag" --follow-tags

          # Build invocation lives in the job-level `build` job below, not here:
          # reusable workflows resolve only at job level, and a GITHUB_TOKEN
          # tag push does not fire on: push: tags workflows anyway.
          #
          # Sync the version table back to master via PR: protected master requires
          # a signed commit and the smoke check, which GITHUB_TOKEN pushes cannot
          # satisfy; a direct bot push would fail every run. The PR branch is reset
          # onto current master every run (force-with-lease; branch is bot-owned)
          # so it never diverges, and the PR is only touched when there is a delta.
          # README sync must never fail the release: tag and build already went
          # out above, so a sync problem surfaces as a warning only.
          (
            pr_branch="docs/release-versions"
            # Populate the remote-tracking ref when the branch exists, so
            # force-with-lease below has a lease to check against.
            git fetch origin "refs/heads/${pr_branch}:refs/remotes/origin/${pr_branch}" 2>/dev/null || true
            git checkout -B "${pr_branch}" origin/master
            git checkout master -- README.md
            if [[ -n "$(git status --porcelain -- README.md)" ]]; then
              git add README.md
              git commit -m "docs: sync release version table (post-${new_tag})"
              if git ls-remote --exit-code --heads origin "refs/heads/${pr_branch}" >/dev/null 2>&1; then
                git push --force-with-lease origin "HEAD:${pr_branch}"
              else
                # First creation: nothing to clobber, plain push.
                git push origin "HEAD:refs/heads/${pr_branch}"
              fi
              gh pr create --base master --head "${pr_branch}" \
                --title "docs: sync release version table" \
                --body "Automated README version-table sync after cutting ${new_tag}." \
                || gh pr edit "${pr_branch}" \
                     --body "Automated README version-table sync after cutting ${new_tag}. (PR already open.)"
            else
              echo "README already in sync on ${pr_branch}"
            fi
          ) || echo "::warning::README version-table sync to master failed; the ${new_tag} release and build are unaffected."
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: release
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    permissions:
      contents: read
      packages: write

  skip_notice:
    needs: release
    if: needs.release.outputs.release_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Explain skip
        run: |
          if [[ "${{ needs.release.outputs.has_changes }}" != "true" ]]; then
            echo "No image-relevant changes since the last release tag; nothing to release."
          else
            echo "::warning::Major dependency update(s) detected since last tag. Skipping automated release; please cut a manual release/tag."
          fi
