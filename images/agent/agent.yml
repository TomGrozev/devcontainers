# HEADLESS AGENT IMAGE OVERLAY — installed at /etc/omp/agent-image/agent.yml.
#
# Loaded through PI_CONFIG_FILES, which omp reads as a platform path-list (":" on
# Unix) and applies as a CLI config overlay BEFORE any --config file. It is
# deep-merged OVER the dots config.yml that ships at ~/.omp/agent/config.yml, so
# this file names only the keys it changes; everything else is inherited.
#
# Merge rules: objects deep-merge, but arrays and scalars REPLACE wholesale. Every
# array below (skills.includeSkills, disabledProviders, bash.patterns) therefore
# restates the complete list this layer wants, not just its additions.
#
# This image is the unattended side of the workflow: a Kelos Task pod clones an
# untrusted repository (the PR-review job clones a PR head) and runs omp with no
# human present. The overlay's job is to remove every capability that assumes a
# human, and to keep the cloned repository from reaching into the harness.

# --- No persistent memory, no lesson capture -----------------------------------
# A throwaway pod has no durable store to read or write, and mnemopi/autolearn
# would otherwise try to build one. `memory.backend` is the switch (there is no
# `memory.enabled`); with it off the `mnemopi:` keys in the base config are inert.
memory:
  backend: off
autolearn:
  enabled: false

# --- No project-level MCP ------------------------------------------------------
# There is no global MCP kill switch. `enableProjectConfig: false` excludes every
# project-level source before dedup, so a cloned repository cannot contribute an
# MCP server — and its `stdio` entries would run arbitrary commands. The image
# ships no mcp.json at all, and the Dockerfile sets OMP_MCP_REQUIRE_READY=1 so a
# print-mode run exits 1 rather than starting without a configured server.
mcp:
  enableProjectConfig: false

# --- Model roles ---------------------------------------------------------------
# Only the four roles the base config points at anthropic/claude-opus-5-5 are
# remapped; the Anthropic models are unavailable in this image (no Anthropic
# credential, and the discovery providers are disabled below).
#
# mimo-v2.6-pro and glm-5.3 are exactly the strong models the base config's own
# retry.fallbackChains already falls back to for these roles, so this keeps the
# image on the same provider family the dots config was written around. An
# unknown model id is a startup warning and a failed role, not a hard error, so
# these two names want re-checking against the live NeuralWatt catalog the first
# time NEURALWATT_API_KEY is wired in.
modelRoles:
  slow: neuralwatt/mimo-v2.6-pro:auto
  plan: neuralwatt/mimo-v2.6-pro:auto
  review: neuralwatt/mimo-v2.6-pro:auto
  designer: neuralwatt/glm-5.3:auto

# --- Skills allowlist ----------------------------------------------------------
# includeSkills is an allowlist of glob patterns applied to the FINAL listing
# (after name resolution), and enablePiProject gates the native provider's
# project skills. Both matter here: the workspace is a cloned untrusted repo, and
# without enablePiProject: false it could ship a `.omp/skills/<name>/SKILL.md`
# that shadows one of the six names below and runs with this image's authority.
skills:
  includeSkills:
    - implement
    - tdd
    - code-review
    - walkthrough
    - land
    - conventional-commit
  enablePiProject: false

# --- Discovery providers -------------------------------------------------------
# disabledProviders is a single shared id namespace covering model providers and
# discovery sources, and this array replaces the base config's wholesale — hence
# the five entries it already carried, restated.
#
# The five appended ids are discovery sources, not model providers: `claude`,
# `codex`, `gemini`, `github` and `agents` (the `.agent[s]` root). When the
# workspace is an untrusted repository — the PR-review job clones a PR head —
# everything those providers contribute (skills, MCP servers, hooks, commands,
# context files, settings) is attacker-controlled, so none of them may load.
disabledProviders:
  - opencode
  - opencode-go
  - ollama
  - llama.cpp
  - lm-studio
  - claude
  - codex
  - gemini
  - github
  - agents

# --- ask -----------------------------------------------------------------------
# `0` (the default) means an unattended `ask` call never returns: the session
# blocks on a dialog nobody can answer. 120s lets the recommendation be taken and
# the run continue.
ask:
  timeout: 120

# --- Tools and approvals -------------------------------------------------------
# approvalMode: yolo is required for an unattended run — the base config pins
# `write`, which stalls on anything outside workspace-write, and a stalled tool
# call is a hung pod.
#
# Only commit_as_me is named here: tools.approval is a record, so it deep-merges
# with the base config's per-tool entries and the rest are inherited. That tool's
# dialog IS its gate (the human picks the identity), so it can never succeed
# headless; under yolo a `prompt` policy would also fail closed with no
# interactive UI, but `deny` states the intent.
tools:
  approvalMode: yolo
  approval:
    commit_as_me: deny

# --- bash command policy -------------------------------------------------------
# Copied verbatim from ~/.omp/config-devcontainer.yml, the existing delta-overlay
# precedent, because approvalMode: yolo bypasses omp's built-in critical-command
# guard (recursive root deletes, fork bombs, host shutdown, ...). Those
# catastrophic-command denies are therefore restated explicitly rather than
# inherited, with a leading `*` so that wrapper prefixes (`rtk`, `sudo`, `time`,
# ...) cannot rewrite the command out from under the pattern. The
# credential-material denies are absolute and carry no override. The trailing
# blanket `allow` is required because arrays replace wholesale: the list must
# state its own complete policy rather than rely on a lower layer's.
bash:
  patterns:
    # --- Credential material: deny, everywhere, no override ---
    - match: "*.ssh/*"
      approval: deny
    - match: "*id_rsa*"
      approval: deny
    - match: "*id_ed25519*"
      approval: deny
    - match: "*.gnupg*"
      approval: deny
    - match: "*.aws/*"
      approval: deny
    - match: "*.kube/config*"
      approval: deny
    - match: "*.docker/config.json*"
      approval: deny
    - match: "*gcloud/*"
      approval: deny
    - match: "*credentials*"
      approval: deny
    - match: "*auth.json*"
      approval: deny
    - match: "*gh/hosts.yml*"
      approval: deny
    - match: "*.password-store*"
      approval: deny
    - match: "*Keychains*"
      approval: deny
    - match: "*.netrc*"
      approval: deny
    - match: "*.git-credentials*"
      approval: deny
    - match: "*.npmrc*"
      approval: deny
    - match: "*.pypirc*"
      approval: deny
    - match: "*.pem*"
      approval: deny
    - match: "*.p12*"
      approval: deny
    - match: "*.pfx*"
      approval: deny
    - match: "*terraform.tfstate*"
      approval: deny
    - match: "security find-generic-password*"
      approval: deny
    - match: "security dump-keychain*"
      approval: deny
    # --- Catastrophic commands: yolo bypasses omp's critical guard, restated here ---
    - match: "*rm -rf /"
      approval: deny
    - match: "*rm -fr /"
      approval: deny
    - match: "*rm -rf /*"
      approval: deny
    - match: "*rm -fr /*"
      approval: deny
    - match: "*rm -rf --no-preserve-root*"
      approval: deny
    - match: "*rm -rf ~"
      approval: deny
    - match: "*rm -rf $HOME"
      approval: deny
    - match: "mkfs*"
      approval: deny
    - match: "*dd if=* of=/dev/*"
      approval: deny
    - match: "diskutil erase*"
      approval: deny
    - match: "diskutil partitionDisk*"
      approval: deny
    - match: "shutdown*"
      approval: deny
    - match: "reboot*"
      approval: deny
    - match: "halt*"
      approval: deny
    - match: ":(){*"
      approval: deny
    # --- Fallback: everything else in the box just runs ---
    - match: "*"
      approval: allow
